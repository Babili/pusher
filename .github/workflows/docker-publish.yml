name: Test, Build and Push Docker Image

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  id-token: write      # Required for SLSA provenance OIDC token generation
  attestations: write  # Required to push provenance and SBOM attestations

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  docker:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app_env: [production, qa, development]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: babili/pusher
          tags: |
            type=sha,format=long,prefix=${{ matrix.app_env }}-
            type=raw,value=${{ matrix.app_env }}-latest

      - name: Build and push Docker image with Provenance
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm/v7,linux/arm64/v8,linux/amd64
          pull: true
          push: true
          build-args: APP_ENV=${{ matrix.app_env }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=babili/pusher:buildcache-${{ matrix.app_env }}
          cache-to: type=registry,ref=babili/pusher:buildcache-${{ matrix.app_env }},mode=max

          # Generate SLSA Provenance and SBOM
          provenance: mode=max
          sbom: true
